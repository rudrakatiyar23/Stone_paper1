<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rock Paper Scissors Game</title>
<style>
    body{
        font-family: Arial;
        background: #c0f1d4;
        text-align: center;
        padding: 40px;
    }
    h1{
        margin-bottom: 20px;
    }
    button{
        padding: 10px 20px;
        margin: 10px;
        border: none;
        background: #1e88e5;
        color: white;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
    }
    button:hover{
        background: #1565c0;
    }
    #result, #score, #round{
        font-size: 20px;
        margin-top: 15px;
    }
</style>
</head>
<body>

<h1>🪨 📄 ✂ Rock Paper Scissors Game</h1>

<div>
    <button onclick="play('rock')">Rock</button>
    <button onclick="play('paper')">Paper</button>
    <button onclick="play('scissors')">Scissors</button>
</div>

<div id="round">Round: 0 / 10</div>
<div id="result">Make your move!</div>
<div id="score">You: 0 | Computer: 0</div>

<script>
let userScore = 0;
let computerScore = 0;
let round = 0;

function play(userChoice){
    if(round >= 10){
        document.getElementById("result").innerHTML = 
            "Game over! Refresh to play again.";
        return;
    }

    const choices = ["rock", "paper", "scissors"];
    const computerChoice = choices[Math.floor(Math.random()*3)];

    round++;

    let result = "";

    if(userChoice === computerChoice){
        result = `Both chose ${userChoice}. It's a Draw!`;
    } 
    else if(
        (userChoice === "rock" && computerChoice === "scissors") ||
        (userChoice === "paper" && computerChoice === "rock") ||
        (userChoice === "scissors" && computerChoice === "paper")
    ){
        userScore++;
        result = `You Win! ${userChoice} beats ${computerChoice}`;
    }
    else{
        computerScore++;
        result = `You Lose! ${computerChoice} beats ${userChoice}`;
    }

    document.getElementById("result").innerHTML = result;
    document.getElementById("round").innerHTML = `Round: ${round} / 10`;
    document.getElementById("score").innerHTML =
        `You: ${userScore} | Computer: ${computerScore}`;

    if(round === 10){
        setTimeout(() => {
            if(userScore > computerScore){
                alert("🎉 You are the FINAL WINNER!");
            } 
            else if(userScore < computerScore){
                alert("😢 Computer Wins the Game!");
            }
            else{
                alert("🤝 It's a Final Draw!");
            }
        }, 200);
    }
}
</script>

</body>
</html>
